name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Susun proyek Android
        run: |
          P=com/gabs/fastflow
          mkdir -p app/src/main/{assets,java/$P,res/drawable,res/mipmap-anydpi-v26}
          cp index.html app/src/main/assets/index.html
          cp MainActivity.kt app/src/main/java/$P/MainActivity.kt
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          E
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.gabs.fastflow'
            compileSdk 34
            defaultConfig { applicationId 'com.gabs.fastflow'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="FastFlow" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".Rcv" android:exported="false">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          E
          cat > app/src/main/res/drawable/bg.xml <<'E'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#17A673"/></shape>
          E
          cat > app/src/main/res/drawable/fg.xml <<'E'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M62,32 A22,22 0 1,0 76,64 A17,17 0 0,1 62,32 Z"/>
          </vector>
          E
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'E'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/bg"/>
            <foreground android:drawable="@drawable/fg"/>
          </adaptive-icon>
          E
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FastFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
